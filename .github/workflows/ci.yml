name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: configure
        run: ./configure

      - name: build & test
        run: |
          just actions-build
          valgrind --leaks-check=full -s ./artifacts/sockery
      - name: clean
        run: just distclean
